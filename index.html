<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FootAuction</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --text: #e0e0e0; --accent: #4caf50; --danger: #f44336; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 900px; }
        .card { background: var(--card); border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h1, h2, h3 { text-align: center; margin-top: 0; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; margin: 5px;}
        .btn-primary { background: #2196f3; color: white; }
        .btn-success { background: var(--accent); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-warning { background: #ff9800; color: white; }
        .btn:disabled { background: #555; cursor: not-allowed; opacity: 0.5; }
        .players-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .player-card { background: #2a2a2a; padding: 15px; border-radius: 8px; text-align: center; border: 2px solid transparent; }
        .player-card.active { border-color: var(--accent); box-shadow: 0 0 15px var(--accent); }
        .player-card.broke { opacity: 0.5; }
        .player-name { font-size: 18px; font-weight: bold; }
        .player-bank { color: var(--accent); font-size: 18px; margin: 5px 0;}
        .player-squad { font-size: 12px; color: #aaa; text-align: left; }
        .auction-box { text-align: center; padding: 20px; border: 2px dashed #444; border-radius: 12px; position: relative; }
        .player-reveal { font-size: 32px; font-weight: bold; color: #ffeb3b; margin: 10px 0; }
        .controls { display: flex; justify-content: center; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        input[type="number"] { padding: 10px; font-size: 18px; border-radius: 8px; border: 1px solid #444; background: #333; color: white; width: 100px; text-align: center;}
        .log { max-height: 150px; overflow-y: auto; background: #000; padding: 10px; border-radius: 8px; font-family: monospace; font-size: 14px;}
        .hidden { display: none !important; }
        .turn-banner { font-size: 20px; font-weight: bold; color: #ffeb3b; margin-bottom: 10px; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏆 FootAuction</h1>

        <div id="screen-login" class="card">
            <h2>Кто ты?</h2>
            <div class="controls">
                <button class="btn btn-primary" onclick="login(0)">Макс</button>
                <button class="btn btn-primary" onclick="login(1)">Пашок</button>
                <button class="btn btn-primary" onclick="login(2)">Тимоха</button>
            </div>
        </div>

        <div id="screen-start" class="card hidden">
            <h2>Выберите тематику (только Максим)</h2>
            <div class="controls" id="theme-buttons">
                <button class="btn btn-primary" onclick="startGame('modern')">Современные</button>
                <button class="btn btn-primary" onclick="startGame('xxi')">21 Век</button>
                <button class="btn btn-primary" onclick="startGame('rpl')">РПЛ</button>
                <button class="btn btn-primary" onclick="startGame('rpl_modern')">РПЛ (Сейчас)</button>
                <button class="btn btn-primary" onclick="startGame('apl')">АПЛ</button>
            </div>
            <p id="waiting-start" style="color:#ffeb3b; margin-top: 20px; font-weight: bold; text-align:center;">Ожидание подключения всех игроков...</p>
        </div>

        <div id="screen-game" class="hidden">
            <div class="card">
                <div class="players-grid" id="players-container"></div>
            </div>

            <div class="card auction-box" id="auction-area">
                <div class="turn-banner" id="turn-banner">Ход: ...</div>
                <h3 id="pos-title">Позиция: ...</h3>
                <div class="player-reveal" id="player-name">???</div>
                <div id="player-cat" style="color:#aaa; margin-bottom:10px;">...</div>
                <div style="font-size: 24px; margin: 10px 0;">Цена: <span id="current-price" style="color:#4caf50; font-weight:bold;">$0.00</span></div>
                
                <div class="controls" id="auction-controls">
                    <input type="number" id="bid-input" placeholder="Сумма" min="1" step="1">
                    <button class="btn btn-success" onclick="placeBid()" id="btn-bid">Поставить</button>
                    <button class="btn btn-danger" onclick="passAuction()" id="btn-pass">Уступить</button>
                </div>

                <div class="controls hidden" id="decision-controls">
                    <button class="btn btn-warning" onclick="soloDecision(true)" id="btn-take">Взять за $1</button>
                    <button class="btn btn-danger" onclick="soloDecision(false)" id="btn-skip">Отказаться</button>
                </div>

                <div id="waiting-text" class="hidden" style="color:#aaa; margin-top:10px; text-align:center;"></div>
            </div>

            <div class="card">
                <h3>Лог</h3>
                <div class="log" id="log-container"></div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let myPlayerIndex = -1;

        socket.on('players_ready', (isReady) => {
            if (myPlayerIndex === -1) return;
            if (isReady) {
                if (myPlayerIndex === 0) {
                    document.getElementById('theme-buttons').classList.remove('hidden');
                    document.getElementById('waiting-start').classList.add('hidden');
                } else {
                    document.getElementById('theme-buttons').classList.add('hidden');
                    document.getElementById('waiting-start').classList.remove('hidden');
                    document.getElementById('waiting-start').textContent = "Все в сборе! Ждем, пока Максим выберет тему...";
                }
            } else {
                document.getElementById('theme-buttons').classList.add('hidden');
                document.getElementById('waiting-start').classList.remove('hidden');
                document.getElementById('waiting-start').textContent = "Ожидание подключения всех игроков...";
            }
        });

        socket.on('state_update', (state) => {
            document.getElementById('screen-start').classList.add('hidden');
            document.getElementById('screen-game').classList.remove('hidden');
            render(state);
        });

        socket.on('log', (data) => {
            const container = document.getElementById('log-container');
            const div = document.createElement('div');
            div.textContent = `> ${data.text}`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        });

        socket.on('game_over', () => { alert("Игра завершена!"); });
        socket.on('error', (data) => { alert(data.message); });

        function login(idx) {
            myPlayerIndex = idx;
            document.getElementById('screen-login').classList.add('hidden');
            document.getElementById('screen-start').classList.remove('hidden');
            socket.emit('login', { player_index: idx });
        }

        function startGame(theme) {
            if (myPlayerIndex !== 0) return;
            socket.emit('start_game', { theme: theme, player_index: myPlayerIndex });
        }

        function render(state) {
            const pContainer = document.getElementById('players-container');
            pContainer.innerHTML = '';
            state.participants.forEach((p, idx) => {
                // ВОТ ЗДЕСЬ МЫ ТЕПЕРЬ ПЕРЕБИРАЕМ МАССИВ, А НЕ ОБЪЕКТ
                const squadStr = p.squad.map(pl => `${pl.pos}: ${pl.name}`).join('<br>') || '—';
                const active = (idx === state.turn_index && !state.waiting_for_decision) ? 'active' : '';
                const broke = (p.bank < 1) ? 'broke' : '';
                pContainer.innerHTML += `
                    <div class="player-card ${active} ${broke}">
                        <div class="player-name">${p.name} ${idx === myPlayerIndex ? '(Вы)' : ''}</div>
                        <div class="player-bank">$${p.bank.toFixed(2)}</div>
                        <div class="player-squad">${squadStr} <br><small>(${p.squad.length}/5)</small></div>
                    </div>
                `;
            });

            document.getElementById('pos-title').textContent = `Позиция: ${state.position} (Раунд ${state.round}/3)`;
            document.getElementById('player-name').textContent = state.current_player;
            document.getElementById('player-cat').textContent = `Категория: ${state.current_cat}`;
            document.getElementById('current-price').textContent = `$${state.current_price.toFixed(2)}`;
            
            const auctionControls = document.getElementById('auction-controls');
            const decisionControls = document.getElementById('decision-controls');
            const turnBanner = document.getElementById('turn-banner');
            const waitingText = document.getElementById('waiting-text');

            if (state.waiting_for_decision) {
                auctionControls.classList.add('hidden');
                turnBanner.textContent = `Решение за ${state.participants[state.solo_winner_id].name}`;
                
                if (state.solo_winner_id === myPlayerIndex) {
                    decisionControls.classList.remove('hidden');
                    waitingText.classList.add('hidden');
                } else {
                    decisionControls.classList.add('hidden');
                    waitingText.classList.remove('hidden');
                    waitingText.textContent = "Ожидание решения...";
                }
            } else {
                decisionControls.classList.add('hidden');
                auctionControls.classList.remove('hidden');
                
                const turnName = state.participants[state.turn_index].name;
                turnBanner.textContent = `Ход: ${turnName}`;
                
                const isMyTurn = (state.turn_index === myPlayerIndex);
                document.getElementById('btn-bid').disabled = !isMyTurn;
                document.getElementById('btn-pass').disabled = !isMyTurn;
                document.getElementById('bid-input').disabled = !isMyTurn;

                if (!isMyTurn) {
                    waitingText.textContent = `Ожидание хода ${turnName}...`;
                    waitingText.classList.remove('hidden');
                } else {
                    waitingText.classList.add('hidden');
                }
            }
        }

        function placeBid() {
            const input = document.getElementById('bid-input');
            const amount = parseFloat(input.value);
            if (isNaN(amount)) return;
            socket.emit('place_bid', { amount: amount });
            input.value = '';
        }

        function passAuction() {
            socket.emit('pass_auction');
        }

        function soloDecision(take) {
            socket.emit('solo_decision', { player_index: myPlayerIndex, take: take });
        }
    </script>
</body>
</html>
